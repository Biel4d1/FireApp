name: Engine CI & Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Install Audio Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libasound2-dev

    - name: Verify & Build
      run: go build -v ./...

    - name: Run Unit & Benchmark Tests
      run: go test -v -bench=. ./...
