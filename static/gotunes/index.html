<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goTunes | Shared Auth Studio</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0c; color: #f3f4f6; margin: 0; padding: 30px 20px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 680px; width: 100%; background: #141417; border: 1px solid #27272a; border-radius: 12px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h1 { font-size: 1.8rem; margin: 0; background: linear-gradient(45deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #9ca3af; margin-bottom: 20px; font-size: 0.9rem; }
        .auth-bar { background: #1c1c21; border: 1px solid #27272a; padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; justify-content: space-between; }
        .auth-inputs { display: flex; gap: 8px; width: 100%; }
        .auth-inputs input { background: #0a0a0c; border: 1px solid #3f3f46; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 0.85rem; width: 35%; }
        .auth-btn { background: #3b82f6; border: none; color: white; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .control-group { margin-bottom: 20px; }
        label { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
        input[type=range] { width: 100%; height: 6px; background: #27272a; border-radius: 3px; outline: none; -webkit-appearance: none; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #00d2ff; cursor: pointer; }
        .btn { display: block; width: 100%; padding: 12px; background: linear-gradient(45deg, #00d2ff, #3a7bd5); border: none; border-radius: 8px; color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer; }
        .status { margin-top: 10px; text-align: center; font-size: 0.85rem; color: #10b981; }
        .recs-title { margin-top: 30px; border-top: 1px solid #27272a; padding-top: 20px; font-size: 1.1rem; font-weight: 600; }
        .rec-card { background: #1c1c21; padding: 14px; border-radius: 8px; margin-top: 12px; border: 1px solid #27272a; }
        .rec-header { display: flex; justify-content: space-between; margin-bottom: 8px; }
        audio { width: 100%; height: 32px; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-bar">
            <h1>goTunes Studio</h1>
            <span id="userBadge" style="font-size: 0.85rem; color: #10b981; font-weight: 600;">Guest Mode</span>
        </div>
        <p>Personalized G Minor Procedural Synth & Extracted MP3 Matching Engine</p>

        <div class="auth-bar" id="authBar">
            <div id="loggedOutState" class="auth-inputs">
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button class="auth-btn" onclick="login()">Login</button>
                <button class="auth-btn" style="background:#10b981;" onclick="signup()">Sign Up</button>
            </div>
            <div id="loggedInState" style="display:none; width:100%; justify-content:space-between; align-items:center;">
                <span id="welcomeMsg" style="font-size:0.9rem; color:#e5e7eb; font-weight:600;"></span>
                <button class="auth-btn" style="background:#ef4444;" onclick="logout()">Logout</button>
            </div>
        </div>

        <button id="streamBtn" class="btn">Start Audio Stream</button>

        <div style="margin-top: 25px;">
            <div class="control-group">
                <label>Valence (Filter Cutoff) <span id="vVal">0.50</span></label>
                <input type="range" id="valence" min="0.1" max="1.0" step="0.05" value="0.50">
            </div>
            <div class="control-group">
                <label>Intensity (Volume/Gain) <span id="iVal">0.50</span></label>
                <input type="range" id="intensity" min="0.1" max="1.0" step="0.05" value="0.50">
            </div>
        </div>

        <div id="status" class="status">Stream Inactive</div>

        <div class="recs-title">Recommended Videos & Extracted Audio Tracks</div>
        <div id="recsList">
            <p style="color: #666; font-size: 0.85rem;">Adjust sliders or sign in to discover matching tracks...</p>
        </div>
    </div>

    <script>
        let audioCtx, isPlaying = false;
        const API_BASE = window.location.origin;

        function updateAuthUI() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('loggedOutState').style.display = 'none';
                document.getElementById('loggedInState').style.display = 'flex';
                document.getElementById('userBadge').innerText = 'Account Linked';
                fetchUserProfile();
            } else {
                document.getElementById('loggedOutState').style.display = 'flex';
                document.getElementById('loggedInState').style.display = 'none';
                document.getElementById('userBadge').innerText = 'Guest Mode';
            }
        }

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (!u || !p) { alert('Please enter username and password'); return; }

            document.getElementById('status').innerText = 'Logging in...';

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username: u, password: p })
                });
                
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    document.getElementById('status').innerText = 'Logged in successfully!';
                    updateAuthUI();
                } else {
                    document.getElementById('status').innerText = 'Login Failed: ' + (data.error || 'Invalid credentials');
                }
            } catch (err) {
                console.error('Login error details:', err);
                document.getElementById('status').innerText = 'Network error: ' + err.message;
            }
        }

        async function signup() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (!u || !p) { alert('Please enter username and password'); return; }

            document.getElementById('status').innerText = 'Creating account...';

            try {
                const res = await fetch(`${API_BASE}/signup`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (res.ok) {
                    login();
                } else {
                    document.getElementById('status').innerText = 'Signup Failed: ' + (data.error || 'User exists');
                }
            } catch (err) {
                document.getElementById('status').innerText = 'Network error during signup: ' + err.message;
            }
        }

        function logout() {
            localStorage.removeItem('token');
            document.getElementById('status').innerText = 'Logged out';
            updateAuthUI();
        }

        async function fetchUserProfile() {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const meRes = await fetch(`${API_BASE}/me`, { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                if (meRes.ok) {
                    const meData = await meRes.json();
                    document.getElementById('welcomeMsg').innerText = `@${meData.user.username}`;
                }

                const res = await fetch(`${API_BASE}/api/user/audio-profile`, { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('valence').value = data.preferred_valence;
                    document.getElementById('intensity').value = data.preferred_intensity;
                    updateParams();
                }
            } catch (e) { console.warn('Profile sync error:', e); }
        }

        document.getElementById('streamBtn').addEventListener('click', async () => {
            if (isPlaying) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 44100 });
            document.getElementById('status').innerText = 'Connecting to procedural stream...';

            try {
                const response = await fetch(`${API_BASE}/stream/procedural`);
                const reader = response.body.getReader();
                isPlaying = true;
                document.getElementById('streamBtn').disabled = true;
                document.getElementById('status').innerText = 'Streaming Live Audio';

                let buffer = new Uint8Array(0);

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    let newBuffer = new Uint8Array(buffer.length + value.length);
                    newBuffer.set(buffer);
                    newBuffer.set(value, buffer.length);
                    buffer = newBuffer;

                    while (buffer.length >= 8820) { 
                        let pcmChunk = buffer.slice(0, 8820);
                        buffer = buffer.slice(8820);

                        let audioBuffer = audioCtx.createBuffer(1, 44100 * 0.1, 44100);
                        let channelData = audioBuffer.getChannelData(0);
                        let dataView = new DataView(pcmChunk.buffer, pcmChunk.byteOffset, pcmChunk.byteLength);

                        for (let i = 0; i < 44100 * 0.1; i++) {
                            let int16 = dataView.getInt16(i * 2, true);
                            channelData[i] = int16 / 32768.0;
                        }

                        let source = audioCtx.createBufferSource();
                        source.buffer = audioBuffer;
                        source.connect(audioCtx.destination);
                        source.start();
                    }
                }
            } catch (err) {
                document.getElementById('status').innerText = 'Stream error: ' + err.message;
            }
        });

        async function fetchRecommendations(valence, intensity) {
            try {
                const res = await fetch(`${API_BASE}/api/recommendations/by-audio?valence=${valence}&intensity=${intensity}`);
                if (!res.ok) return;
                const data = await res.json();
                
                const recsDiv = document.getElementById('recsList');
                if (!data.recommended_videos || data.recommended_videos.length === 0) {
                    recsDiv.innerHTML = '<p style="color:#666; font-size:0.85rem;">No matching video MP3s found yet.</p>';
                    return;
                }

                recsDiv.innerHTML = data.recommended_videos.map(v => `
                    <div class="rec-card">
                        <div class="rec-header">
                            <span style="font-weight:600; color:#e5e7eb;">${v.description || v.filename}</span>
                            <a href="/video/${v.filename}" target="_blank" style="color:#00d2ff; text-decoration:none; font-size:0.85rem;">Watch Video ↗</a>
                        </div>
                        <audio controls data-video-id="${v.id}" src="/${v.mp3_path}"></audio>
                    </div>
                `).join('');

                setTimeout(attachAudioTrackers, 500);
            } catch (e) { console.warn('Failed to load recommendations:', e); }
        }

        function attachAudioTrackers() {
            const token = localStorage.getItem('token');
            if (!token) return;

            document.querySelectorAll('.rec-card audio').forEach(audioEl => {
                let startTime = 0;
                audioEl.addEventListener('play', () => { startTime = Date.now(); });
                audioEl.addEventListener('pause', () => {
                    if (startTime > 0) {
                        const listenMs = Date.now() - startTime;
                        const videoId = audioEl.getAttribute('data-video-id');
                        if (videoId) {
                            fetch(`${API_BASE}/api/gotunes/record-listen`, {
                                method: 'POST',
                                headers: { 
                                    'Content-Type': 'application/json',
                                    'Authorization': `Bearer ${token}`
                                },
                                body: JSON.stringify({ video_id: parseInt(videoId), listen_ms: listenMs })
                            });
                        }
                        startTime = 0;
                    }
                });
            });
        }

        async function updateParams() {
            const valence = parseFloat(document.getElementById('valence').value);
            const intensity = parseFloat(document.getElementById('intensity').value);

            document.getElementById('vVal').innerText = valence.toFixed(2);
            document.getElementById('iVal').innerText = intensity.toFixed(2);

            await fetch(`${API_BASE}/api/audio/parameters`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ valence, intensity })
            });

            fetchRecommendations(valence, intensity);
        }

        ['valence', 'intensity'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateParams);
        });

        updateAuthUI();
    </script>
</body>
</html>
