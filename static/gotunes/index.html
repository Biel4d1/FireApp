<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>goTunes | Audio Library</title>
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #15161e;
            --card-border: #232533;
            --accent: #00d2ff;
            --accent-glow: rgba(0, 210, 255, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            width: 100%;
            max-width: 900px;
            padding: 30px 20px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .brand p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .auth-box {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 8px 12px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .auth-box input {
            background: #0a0a0c;
            border: 1px solid #2d2f3e;
            color: #fff;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.8rem;
            outline: none;
            width: 110px;
        }

        .auth-box button {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .auth-box button:hover { opacity: 0.9; }

        .main-container {
            width: 100%;
            max-width: 900px;
            padding: 0 20px;
        }

        .controls-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 12px 16px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .filter-group {
            display: flex;
            gap: 15px;
            align-items: center;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0 16px;
            border-radius: 10px;
        }

        .filter-slider {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .filter-slider input[type=range] {
            width: 80px;
            accent-color: var(--accent);
        }

        .track-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .track-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
            position: relative;
        }

        .track-card:hover {
            transform: translateY(-2px);
            border-color: #3b3e54;
        }

        .track-card.active {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .track-info {
            margin-bottom: 12px;
        }

        .track-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        .play-btn {
            background: #232533;
            color: var(--text-main);
            border: none;
            padding: 8px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-card.active .play-btn {
            background: var(--accent);
            color: #000;
        }

        /* Fixed Bottom Player */
        .player-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(21, 22, 30, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--card-border);
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
        }

        .now-playing {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 30%;
        }

        .now-playing-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .now-playing-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .player-controls {
            width: 40%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        audio {
            width: 100%;
            height: 36px;
        }

        .status-pill {
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 20px;
            background: #1a1c24;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .status-pill.online {
            color: #10b981;
            border-color: rgba(16, 185, 129, 0.3);
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="brand">
            <h1>goTunes Library</h1>
            <p>Extracted Audio Tracks & Recommendation Engine</p>
        </div>
        <div class="auth-box" id="authBox">
            <div id="loggedOut" style="display: flex; gap: 6px;">
                <input type="text" id="username" placeholder="Username">
                <input type="password" id="password" placeholder="Password">
                <button onclick="login()">Login</button>
            </div>
            <div id="loggedIn" style="display: none; align-items: center; gap: 10px;">
                <span id="userTag" style="font-size: 0.85rem; font-weight: 600;"></span>
                <button onclick="logout()" style="background: #ef4444; color: #fff;">Logout</button>
            </div>
        </div>
    </div>

    <div class="main-container">
        <div class="controls-bar">
            <input type="text" id="searchInput" class="search-input" placeholder="Search extracted audio by name, tag, or description..." oninput="filterTracks()">
            
            <div class="filter-group">
                <div class="filter-slider">
                    <span>Brightness</span>
                    <input type="range" id="valence" min="0.1" max="1.0" step="0.05" value="0.50" onchange="loadRecommendations()">
                </div>
                <div class="filter-slider">
                    <span>Energy</span>
                    <input type="range" id="intensity" min="0.1" max="1.0" step="0.05" value="0.50" onchange="loadRecommendations()">
                </div>
            </div>
        </div>

        <div id="trackGrid" class="track-grid">
            <p style="color: var(--text-muted); font-size: 0.85rem;">Loading audio library...</p>
        </div>
    </div>

    <div class="player-bar">
        <div class="now-playing">
            <div>
                <div id="currentTitle" class="now-playing-title">No Track Selected</div>
                <div id="currentSub" class="now-playing-sub">Select a track from the library</div>
            </div>
        </div>
        
        <div class="player-controls">
            <audio id="globalAudio" controls src=""></audio>
        </div>

        <div>
            <span id="statusBadge" class="status-pill">Guest Mode</span>
        </div>
    </div>

    <script>
        let tracksData = [];
        let activeVideoId = null;
        let listenStartTime = 0;

        function updateAuthUI() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('loggedOut').style.display = 'none';
                document.getElementById('loggedIn').style.display = 'flex';
                document.getElementById('statusBadge').innerText = 'Account Linked';
                document.getElementById('statusBadge').classList.add('online');
                fetchUserProfile();
            } else {
                document.getElementById('loggedOut').style.display = 'flex';
                document.getElementById('loggedIn').style.display = 'none';
                document.getElementById('statusBadge').innerText = 'Guest Mode';
                document.getElementById('statusBadge').classList.remove('online');
            }
        }

        async function login() {
            const u = document.getElementById('username').value.trim();
            const p = document.getElementById('password').value.trim();
            if (!u || !p) return;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (res.ok && data.token) {
                    localStorage.setItem('token', data.token);
                    updateAuthUI();
                } else {
                    alert('Login failed: ' + (data.error || 'Invalid credentials'));
                }
            } catch (e) { alert('Network error during login'); }
        }

        function logout() {
            localStorage.removeItem('token');
            updateAuthUI();
        }

        async function fetchUserProfile() {
            const token = localStorage.getItem('token');
            if (!token) return;

            try {
                const meRes = await fetch('/me', { headers: { 'Authorization': `Bearer ${token}` } });
                if (meRes.ok) {
                    const meData = await meRes.json();
                    document.getElementById('userTag').innerText = `@${meData.user.username}`;
                }

                const res = await fetch('/api/user/audio-profile', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('valence').value = data.preferred_valence;
                    document.getElementById('intensity').value = data.preferred_intensity;
                    loadRecommendations();
                }
            } catch (e) { console.warn('Profile sync warning:', e); }
        }

        async function loadRecommendations() {
            const valence = document.getElementById('valence').value;
            const intensity = document.getElementById('intensity').value;

            try {
                const res = await fetch(`/api/recommendations/by-audio?valence=${valence}&intensity=${intensity}`);
                if (!res.ok) return;
                const data = await res.json();
                tracksData = data.recommended_videos || [];
                renderGrid(tracksData);
            } catch (e) { console.warn('Failed to fetch library:', e); }
        }

        function renderGrid(tracks) {
            const grid = document.getElementById('trackGrid');
            if (!tracks || tracks.length === 0) {
                grid.innerHTML = '<p style="color: var(--text-muted); font-size: 0.85rem;">No matching audio tracks found.</p>';
                return;
            }

            grid.innerHTML = tracks.map(t => `
                <div class="track-card ${activeVideoId === t.id ? 'active' : ''}" onclick="playTrack(${t.id}, '${t.description || t.filename}', '/${t.mp3_path}')">
                    <div class="track-info">
                        <div class="track-title">${t.description || t.filename}</div>
                        <div class="track-meta">
                            <span>Valence: ${t.valence.toFixed(2)}</span>
                            <span>Intensity: ${t.intensity.toFixed(2)}</span>
                        </div>
                        ${t.tags ? `<div style="font-size:0.7rem; color:#00d2ff; margin-top:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">🏷 ${t.tags}</div>` : ''}
                    </div>
                    <button class="play-btn">
                        ${activeVideoId === t.id ? '▶ Playing' : '▶ Play Track'}
                    </button>
                </div>
            `).join('');
        }

        function filterTracks() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const filtered = tracksData.filter(t => 
                (t.description && t.description.toLowerCase().includes(q)) ||
                (t.filename && t.filename.toLowerCase().includes(q)) ||
                (t.tags && t.tags.toLowerCase().includes(q))
            );
            renderGrid(filtered);
        }

        function playTrack(id, title, mp3Url) {
            recordListenDuration();

            activeVideoId = id;
            listenStartTime = Date.now();

            document.getElementById('currentTitle').innerText = title;
            document.getElementById('currentSub').innerText = `Track ID #${id}`;

            const player = document.getElementById('globalAudio');
            player.src = mp3Url;
            player.play();

            renderGrid(tracksData);
        }

        function recordListenDuration() {
            if (activeVideoId && listenStartTime > 0) {
                const listenMs = Date.now() - listenStartTime;
                const token = localStorage.getItem('token');

                if (token && listenMs > 1000) {
                    fetch('/api/gotunes/record-listen', {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ video_id: activeVideoId, listen_ms: listenMs })
                    });
                }
            }
            listenStartTime = 0;
        }

        const player = document.getElementById('globalAudio');
        player.addEventListener('pause', recordListenDuration);
        player.addEventListener('ended', recordListenDuration);

        updateAuthUI();
        loadRecommendations();
    </script>
</body>
</html>
